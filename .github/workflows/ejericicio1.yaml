#1. Variables de Entorno Globales:
 #Crea un workflow que defina una variable de entorno a
 # nivel de workflow y la use en dos jobs distintos.

name: Ejercicio 1
on:
  workflow_dispatch: 
env: 
  NOMBRE: "Carlota"
jobs:
  say_hello:
    name: "Let's greet the user!" 
    runs-on: ubuntu-latest
    steps: 
      - run: echo "Hello $NOMBRE!"
  say_goodye:
    name: "Let's say goodbye to the user!" 
    runs-on: ubuntu-latest
    steps: 
      - run: echo "Bye $NOMBRE!"